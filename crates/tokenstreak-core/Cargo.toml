[package]
name = "tokenstreak-core"
description = "Local, privacy-first parsing and aggregation of AI coding-agent token usage (Claude Code, Codex CLI, Gemini CLI)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["watch", "net"]
# File watching with notify (FSEvents on macOS).
watch = ["dep:notify", "dep:notify-debouncer-full"]
# The only network call in the product: an optional, user-triggered price list refresh.
net = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jiff = "0.2"
memchr = "2"
rayon = "1"
rustc-hash = "2"
thiserror = "2"
tracing = "0.1"
bincode = "1.3"
walkdir = "2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }
ureq = { version = "3", optional = true }
# Returns freed memory to the OS promptly (macOS malloc caches large frees).
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[bin]]
name = "tokenstreak-cli"
path = "src/bin/cli.rs"
